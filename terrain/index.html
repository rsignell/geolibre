<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>US 3D Terrain — geolibre</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }

  #search {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 1;
    width: 260px;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #search input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: none;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    font-size: 14px;
  }
  #search-results {
    margin-top: 4px;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    overflow: hidden;
    display: none;
  }
  #search-results div {
    padding: 8px 10px;
    cursor: pointer;
    border-bottom: 1px solid #eee;
  }
  #search-results div:last-child { border-bottom: none; }
  #search-results div:hover { background: #f0f0f0; }
  #search-results .sub { color: #777; font-size: 12px; }

  #exaggeration {
    position: absolute;
    bottom: 30px;
    left: 10px;
    z-index: 1;
    background: #fff;
    padding: 8px 12px;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #exaggeration label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  #exaggeration input {
    width: 180px;
  }
</style>
</head>
<body>
<div id="search">
  <input id="search-input" type="text" placeholder="Search for a place&hellip;" autocomplete="off" />
  <div id="search-results"></div>
</div>
<div id="exaggeration">
  <label for="exaggeration-slider">Vertical exaggeration <span id="exaggeration-value">1.5&times;</span></label>
  <input id="exaggeration-slider" type="range" min="0" max="5" step="0.1" value="1.5" />
</div>
<div id="map"></div>
<script>
  const DEFAULT_EXAGGERATION = 1.5;
  const map = new maplibregl.Map({
    container: 'map',
    style: 'us-3d-terrain.json',
    hash: true
  });
  map.addControl(new maplibregl.NavigationControl());
  map.addControl(new maplibregl.TerrainControl({ source: 'terrain-dem', exaggeration: DEFAULT_EXAGGERATION }));
  map.on('load', () => {
    map.setTerrain({ source: 'terrain-dem', exaggeration: DEFAULT_EXAGGERATION });
  });

  // --- Vertical exaggeration slider ---
  const exaggerationSlider = document.getElementById('exaggeration-slider');
  const exaggerationValue = document.getElementById('exaggeration-value');
  exaggerationSlider.addEventListener('input', () => {
    const value = parseFloat(exaggerationSlider.value);
    exaggerationValue.textContent = `${value.toFixed(1)}×`;
    if (map.getTerrain()) {
      map.setTerrain({ source: 'terrain-dem', exaggeration: value });
    }
  });

  // --- Place search (Photon geocoder, no API key required) ---
  const input = document.getElementById('search-input');
  const resultsBox = document.getElementById('search-results');
  let debounceTimer;

  function clearResults() {
    resultsBox.innerHTML = '';
    resultsBox.style.display = 'none';
  }

  function formatLabel(props) {
    const parts = [props.name];
    if (props.city && props.city !== props.name) parts.push(props.city);
    if (props.state) parts.push(props.state);
    if (props.country) parts.push(props.country);
    return parts.filter(Boolean).join(', ');
  }

  async function runSearch(query) {
    if (!query || query.length < 2) {
      clearResults();
      return;
    }
    const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=6&lat=39&lon=-98`;
    let data;
    try {
      const resp = await fetch(url);
      data = await resp.json();
    } catch (err) {
      console.error('geocoder error', err);
      return;
    }
    const features = (data && data.features) || [];
    if (!features.length) {
      clearResults();
      return;
    }
    resultsBox.innerHTML = '';
    for (const f of features) {
      const [lon, lat] = f.geometry.coordinates;
      const extent = f.properties.extent; // [minLon, maxLat, maxLon, minLat] when present
      const div = document.createElement('div');
      div.textContent = formatLabel(f.properties);
      div.addEventListener('click', () => {
        if (extent) {
          map.fitBounds(
            [[extent[0], extent[3]], [extent[2], extent[1]]],
            { padding: 40, pitch: map.getPitch(), duration: 1500 }
          );
        } else {
          map.flyTo({ center: [lon, lat], zoom: 11, duration: 1500 });
        }
        clearResults();
        input.value = formatLabel(f.properties);
      });
      resultsBox.appendChild(div);
    }
    resultsBox.style.display = 'block';
  }

  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const query = input.value.trim();
    debounceTimer = setTimeout(() => runSearch(query), 350);
  });

  document.addEventListener('click', (e) => {
    if (!document.getElementById('search').contains(e.target)) {
      clearResults();
    }
  });
</script>
</body>
</html>
