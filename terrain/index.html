<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>US 3D Terrain — geolibre</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }

  #search {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 1;
    width: 260px;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #search input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: none;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    font-size: 14px;
  }
  #search-results {
    margin-top: 4px;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    overflow: hidden;
    display: none;
  }
  #search-results div {
    padding: 8px 10px;
    cursor: pointer;
    border-bottom: 1px solid #eee;
  }
  #search-results div:last-child { border-bottom: none; }
  #search-results div:hover { background: #f0f0f0; }
  #search-results .sub { color: #777; font-size: 12px; }

  /* Shared popover panel for the custom top-right controls */
  .ctrl-popover {
    display: none;
    position: absolute;
    top: 0;
    right: 100%;
    margin-right: 8px;
    max-width: min(260px, calc(100vw - 32px));
    max-height: min(70vh, 420px);
    overflow-y: auto;
    box-sizing: border-box;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    padding: 10px 12px;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .ctrl-popover.open { display: block; }

  .terrain-menu-panel { width: 200px; }
  .terrain-menu-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .terrain-menu-row + .terrain-menu-row { margin-top: 8px; }
  .terrain-menu-value { color: #555; white-space: nowrap; }
  #terrain-exaggeration-slider { flex: 1; }
  #terrain-exaggeration-slider:disabled { opacity: 0.4; }

  .attribution-panel {
    width: 260px;
    font-size: 12px;
    color: #333;
  }
  .attribution-panel h4 {
    margin: 0 0 4px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #888;
  }
  .attribution-panel section + section { margin-top: 10px; }
  .attribution-panel p { margin: 0 0 6px; }
  .attribution-panel p:last-child { margin-bottom: 0; }
  .attribution-panel a { color: #0366d6; }

  .info-ctrl-button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 29px;
    height: 29px;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="search">
  <input id="search-input" type="text" placeholder="Search for a place&hellip;" autocomplete="off" />
  <div id="search-results"></div>
</div>
<div id="map"></div>
<script>
  const DEFAULT_EXAGGERATION = 1.5;

  // --- Custom terrain control: mountain icon that opens an on/off + exaggeration menu ---
  class TerrainMenuControl {
    constructor({ source, exaggeration }) {
      this._source = source;
      this._exaggeration = exaggeration;
      this._enabled = true;
    }

    onAdd(map) {
      this._map = map;

      this._container = document.createElement('div');
      this._container.className = 'maplibregl-ctrl maplibregl-ctrl-group';

      this._button = document.createElement('button');
      this._button.type = 'button';
      this._button.title = 'Terrain settings';
      this._button.className = 'maplibregl-ctrl-terrain maplibregl-ctrl-terrain-enabled';
      const icon = document.createElement('span');
      icon.className = 'maplibregl-ctrl-icon';
      icon.setAttribute('aria-hidden', 'true');
      this._button.appendChild(icon);

      this._panel = document.createElement('div');
      this._panel.className = 'ctrl-popover terrain-menu-panel';
      this._panel.innerHTML = `
        <div class="terrain-menu-row">
          <label for="terrain-enabled-toggle">Terrain</label>
          <input id="terrain-enabled-toggle" type="checkbox" checked />
        </div>
        <div class="terrain-menu-row">
          <label for="terrain-exaggeration-slider">Exaggeration</label>
          <span class="terrain-menu-value" id="terrain-exaggeration-value">${this._exaggeration.toFixed(1)}&times;</span>
        </div>
        <div class="terrain-menu-row">
          <input id="terrain-exaggeration-slider" type="range" min="1" max="5" step="0.1" value="${this._exaggeration}" />
        </div>
      `;

      this._button.addEventListener('click', () => {
        this._panel.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!this._container.contains(e.target)) {
          this._panel.classList.remove('open');
        }
      });

      this._container.appendChild(this._button);
      this._container.appendChild(this._panel);

      const toggle = this._panel.querySelector('#terrain-enabled-toggle');
      const slider = this._panel.querySelector('#terrain-exaggeration-slider');
      const valueLabel = this._panel.querySelector('#terrain-exaggeration-value');

      toggle.addEventListener('change', () => {
        this._enabled = toggle.checked;
        slider.disabled = !this._enabled;
        this._button.classList.toggle('maplibregl-ctrl-terrain-enabled', this._enabled);
        this._apply();
      });

      slider.addEventListener('input', () => {
        this._exaggeration = parseFloat(slider.value);
        valueLabel.textContent = `${this._exaggeration.toFixed(1)}×`;
        this._apply();
      });

      return this._container;
    }

    onRemove() {
      this._container.remove();
      this._map = undefined;
    }

    _apply() {
      if (this._enabled) {
        this._map.setTerrain({ source: this._source, exaggeration: this._exaggeration });
      } else {
        this._map.setTerrain(null);
      }
    }
  }

  // --- Custom attribution control: compact "i" icon with a text popover ---
  class InfoControl {
    constructor(attributions) {
      this._attributions = attributions;
    }

    onAdd(map) {
      this._map = map;

      this._container = document.createElement('div');
      this._container.className = 'maplibregl-ctrl maplibregl-ctrl-group';

      this._button = document.createElement('button');
      this._button.type = 'button';
      this._button.title = 'Attribution';
      this._button.setAttribute('aria-label', 'Toggle attribution');
      this._button.className = 'info-ctrl-button';
      this._button.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="9" fill="#fff" stroke="#333" stroke-width="1.25" />
          <text x="10" y="14.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" font-weight="bold" fill="#333">i</text>
        </svg>
      `;

      this._panel = document.createElement('div');
      this._panel.className = 'ctrl-popover attribution-panel';
      this._panel.innerHTML = `
        <section>
          <h4>Data &amp; imagery</h4>
          <p>${this._attributions.join(' | ')}</p>
        </section>
        <section>
          <h4>How this was built</h4>
          <p>A single static page using <a href="https://maplibre.org/" target="_blank" rel="noopener">MapLibre GL JS</a> to render 3D terrain in the browser &mdash; no server and no API keys.</p>
          <p>Terrain comes from AWS's open Terrarium elevation tiles, imagery from Esri World Imagery, and roads/place labels from OpenStreetMap data served by <a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a>. Place search uses the free <a href="https://photon.komoot.io/" target="_blank" rel="noopener">Photon</a> geocoder.</p>
          <p>Source on <a href="https://github.com/rsignell/geolibre" target="_blank" rel="noopener">GitHub</a>.</p>
        </section>
      `;

      this._button.addEventListener('click', () => {
        this._panel.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!this._container.contains(e.target)) {
          this._panel.classList.remove('open');
        }
      });

      this._container.appendChild(this._button);
      this._container.appendChild(this._panel);
      return this._container;
    }

    onRemove() {
      this._container.remove();
      this._map = undefined;
    }
  }

  const map = new maplibregl.Map({
    container: 'map',
    style: 'us-3d-terrain.json',
    hash: true,
    attributionControl: false
  });
  map.addControl(new maplibregl.NavigationControl());
  map.addControl(new TerrainMenuControl({ source: 'terrain-dem', exaggeration: DEFAULT_EXAGGERATION }));
  map.addControl(new InfoControl([
    '© OpenStreetMap contributors',
    'Esri, Maxar, Earthstar Geographics',
    'AWS Terrain Tiles (Mapzen/Nextzen), USGS, NASA'
  ]));

  map.on('load', () => {
    map.setTerrain({ source: 'terrain-dem', exaggeration: DEFAULT_EXAGGERATION });
  });

  // --- Place search (Photon geocoder, no API key required) ---
  const input = document.getElementById('search-input');
  const resultsBox = document.getElementById('search-results');
  let debounceTimer;

  function clearResults() {
    resultsBox.innerHTML = '';
    resultsBox.style.display = 'none';
  }

  function formatLabel(props) {
    const parts = [props.name];
    if (props.city && props.city !== props.name) parts.push(props.city);
    if (props.state) parts.push(props.state);
    if (props.country) parts.push(props.country);
    return parts.filter(Boolean).join(', ');
  }

  async function runSearch(query) {
    if (!query || query.length < 2) {
      clearResults();
      return;
    }
    const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=6&lat=39&lon=-98`;
    let data;
    try {
      const resp = await fetch(url);
      data = await resp.json();
    } catch (err) {
      console.error('geocoder error', err);
      return;
    }
    const features = (data && data.features) || [];
    if (!features.length) {
      clearResults();
      return;
    }
    resultsBox.innerHTML = '';
    for (const f of features) {
      const [lon, lat] = f.geometry.coordinates;
      const extent = f.properties.extent; // [minLon, maxLat, maxLon, minLat] when present
      const div = document.createElement('div');
      div.textContent = formatLabel(f.properties);
      div.addEventListener('click', () => {
        if (extent) {
          map.fitBounds(
            [[extent[0], extent[3]], [extent[2], extent[1]]],
            { padding: 40, pitch: map.getPitch(), duration: 1500 }
          );
        } else {
          map.flyTo({ center: [lon, lat], zoom: 11, duration: 1500 });
        }
        clearResults();
        input.value = formatLabel(f.properties);
      });
      resultsBox.appendChild(div);
    }
    resultsBox.style.display = 'block';
  }

  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const query = input.value.trim();
    debounceTimer = setTimeout(() => runSearch(query), 350);
  });

  document.addEventListener('click', (e) => {
    if (!document.getElementById('search').contains(e.target)) {
      clearResults();
    }
  });
</script>
</body>
</html>
